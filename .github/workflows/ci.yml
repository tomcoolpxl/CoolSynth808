name: CoolSynth 808 tests

# The test program in Debug (the everyday build, compiled optimised) and in Release (what ships), as CoolSynth's
# own CI runs its tests in Release (CoolSynth's D363).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.configuration }} --parallel --target CoolSynth808Tests

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
